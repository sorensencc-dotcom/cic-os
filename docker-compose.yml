version: '3.8'

services:
  cic-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: cic-dev
    restart: unless-stopped

    environment:
      - NODE_ENV=development
      - CIC_ENV=development
      - CIC_PROJECT_ROOT=/workspace
      - CIC_MCP_PORT=3100
      - CIC_LOG_DIR=/workspace/logs
      - CIC_STARTUP_TIMEOUT=60
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      # Optional: enable dry-run mode for testing without side effects
      - CIC_DRY_RUN=${CIC_DRY_RUN:-false}
      # Optional: disable permission prompts for CI/headless mode
      - CLAUDE_SKIP_PERMISSIONS=${CLAUDE_SKIP_PERMISSIONS:-true}

    ports:
      # MCP primary port
      - "3100:3100"
      # MCP secondary servers (git, filesystem, etc.)
      - "3101-3110:3101-3110"
      # SSH for remote access (optional)
      - "2222:22"

    volumes:
      # Project code
      - .:/workspace
      # Logs (preserved across restarts)
      - ./logs:/workspace/logs
      # SSH keys for remote access (optional)
      - ${HOME}/.ssh:/home/chris/.ssh:ro
      # Config (optional)
      - ${HOME}/.config/cic:/home/chris/.config/cic:ro

    # Healthcheck validates MCP startup
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Keep container running for interactive/headless operation
    stdin_open: true
    tty: true

    networks:
      - cic-network

networks:
  cic-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
