version: '3.8'

services:
  # cic-dev: Commented out (separate git repo, build locally via 'npm run build')
  # Use local Phase 0.7 build system instead (see below)

  # Phase 0.7: Lineage Registry (provenance + SBOM tracking)
  lineage-registry:
    build:
      context: .
      dockerfile: build-system/docker/Dockerfile.lineage-registry
    container_name: lineage-registry
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - PORT=3102
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=cic_lineage
      - DB_USER=cic
      - DB_PASSWORD=cic_dev_pass
    ports:
      - "3102:3102"
    depends_on:
      - postgres
    networks:
      - cic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3102/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Phase 0.7: Routing Validator (OPA policy enforcement)
  routing-validator:
    build:
      context: .
      dockerfile: build-system/docker/Dockerfile.routing-validator
    container_name: routing-validator
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - PORT=3103
      - OPA_ENABLED=true
    ports:
      - "3103:3103"
    networks:
      - cic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3103/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Phase 0.7: Build Executor (worker that executes DAG nodes)
  build-executor:
    build:
      context: .
      dockerfile: build-system/docker/Dockerfile.build-executor
    container_name: build-executor
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - BUILD_PHASE=0.7
      - PORT=3101
      - REDIS_URL=redis://redis:6379
      - LINEAGE_URL=http://lineage-registry:3102
      - ROUTING_URL=http://routing-validator:3103
    ports:
      - "3101:3101"
    depends_on:
      - lineage-registry
      - routing-validator
      - redis
    networks:
      - cic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3101/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Phase 0.7: Redis (async message queue for builds)
  redis:
    image: redis:7-alpine
    container_name: redis-cic
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - cic-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Phase 0.7: Build Orchestrator (HTTP API + coordination)
  build-orchestrator:
    build:
      context: .
      dockerfile: build-system/docker/Dockerfile.orchestrator
    container_name: build-orchestrator
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - BUILD_PHASE=0.7
      - PORT=3104
      - REDIS_URL=redis://redis:6379
      - BUILD_EXECUTOR_URL=http://build-executor:3101
      - LINEAGE_URL=http://lineage-registry:3102
      - ROUTING_URL=http://routing-validator:3103
      - NEMOTRON_URL=http://nemotron:9000
      - NIM_GATEWAY_URL=http://nim-gateway:8000
      - GIT_SHA=${GIT_SHA:-dev}
    ports:
      - "3104:3104"
    depends_on:
      - lineage-registry
      - routing-validator
      - build-executor
      - redis
    networks:
      - cic-network
    volumes:
      - .:/app:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3104/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # PostgreSQL: Lineage & Artifact Storage
  postgres:
    image: postgres:15-alpine
    container_name: postgres-cic
    restart: unless-stopped
    environment:
      - POSTGRES_DB=cic_lineage
      - POSTGRES_USER=cic
      - POSTGRES_PASSWORD=cic_dev_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cic"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  cic-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
