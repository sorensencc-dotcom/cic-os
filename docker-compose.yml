version: '3.8'

services:
  cic-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: cic-dev
    restart: unless-stopped

    environment:
      - NODE_ENV=development
      - CIC_ENV=development
      - CIC_PROJECT_ROOT=/workspace
      - CIC_MCP_PORT=3100
      - CIC_LOG_DIR=/workspace/logs
      - CIC_STARTUP_TIMEOUT=60
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      # Optional: enable dry-run mode for testing without side effects
      - CIC_DRY_RUN=${CIC_DRY_RUN:-false}
      # Optional: disable permission prompts for CI/headless mode
      - CLAUDE_SKIP_PERMISSIONS=${CLAUDE_SKIP_PERMISSIONS:-true}

    ports:
      # MCP primary port
      - "3100:3100"
      # MCP secondary servers (git, filesystem, etc.)
      - "3101-3110:3101-3110"
      # SSH for remote access (optional)
      - "2222:22"

    volumes:
      # Project code
      - .:/workspace
      # Logs (preserved across restarts)
      - ./logs:/workspace/logs
      # SSH keys for remote access (optional)
      - ${HOME}/.ssh:/home/chris/.ssh:ro
      # Config (optional)
      - ${HOME}/.config/cic:/home/chris/.config/cic:ro

    # Healthcheck validates MCP startup
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Keep container running for interactive/headless operation
    stdin_open: true
    tty: true

    # Resource limits (prevent host exhaustion)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

    networks:
      - cic-network

  # Phase 0.7: Lineage Registry (provenance + SBOM tracking)
  lineage-registry:
    build:
      context: .
      dockerfile: build-system/docker/Dockerfile.lineage-registry
    container_name: lineage-registry
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=cic_lineage
    ports:
      - "3102:3102"
    depends_on:
      - postgres
    networks:
      - cic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3102/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Phase 0.7: Routing Validator (OPA policy enforcement)
  routing-validator:
    build:
      context: .
      dockerfile: build-system/docker/Dockerfile.routing-validator
    container_name: routing-validator
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - OPA_ENABLED=true
    ports:
      - "3103:3103"
    networks:
      - cic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3103/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Phase 0.7: Build Executor (DAG execution)
  build-executor:
    build:
      context: .
      dockerfile: build-system/docker/Dockerfile.build-executor
    container_name: build-executor
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - BUILD_PHASE=0.7
      - LINEAGE_URL=http://lineage-registry:3102
      - ROUTING_URL=http://routing-validator:3103
    ports:
      - "3101:3101"
    depends_on:
      - lineage-registry
      - routing-validator
    networks:
      - cic-network
    volumes:
      - ./phase0.7:/app/config:ro

  # Phase 0.7: Build Orchestrator (HTTP API + coordination)
  build-orchestrator:
    build:
      context: .
      dockerfile: build-system/docker/Dockerfile.orchestrator
    container_name: build-orchestrator
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - BUILD_PHASE=0.7
      - PORT=3100
      - LINEAGE_URL=http://lineage-registry:3102
      - ROUTING_URL=http://routing-validator:3103
      - NEMOTRON_URL=http://nemotron:9000
      - NIM_GATEWAY_URL=http://nim-gateway:8000
      - GIT_SHA=${GIT_SHA:-dev}
    ports:
      - "3100:3100"
    depends_on:
      - lineage-registry
      - routing-validator
      - build-executor
    networks:
      - cic-network
    volumes:
      - .:/app:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # PostgreSQL: Lineage & Artifact Storage
  postgres:
    image: postgres:15-alpine
    container_name: postgres-cic
    restart: unless-stopped
    environment:
      - POSTGRES_DB=cic_lineage
      - POSTGRES_USER=cic
      - POSTGRES_PASSWORD=cic_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cic"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  cic-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
