site_name: CIC Build Automation
site_description: Build automation, scheduling, and roadmap management for CIC phases
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: amber
  features:
    - navigation.instant
    - navigation.top
    - toc.integrate
    - search.suggest

nav:
  - Home: index.md
  - Build Automation:
      - Guide: automation/guide.md
      - Skills Reference: automation/skills.md
  - Phase 0.7:
      - Overview: phase0.7/index.md
      - Build Graph: phase0.7/build-graph.md
      - Agents: phase0.7/agents.md
      - Routing: phase0.7/routing.md
      - Inference: phase0.7/inference-routing.md
      - Security: phase0.7/security-hardening.md
      - CLI Reference: phase0.7/cli-reference.md
      - Operator Runbook: phase0.7/operator-runbook.md
      - Day-2 Ops: phase0.7/day2-ops.md
  - About: about.md

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables
  - attr_list
  - md_in_html
