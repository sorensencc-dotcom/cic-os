site_name: CIC Build Automation
site_description: Build automation, scheduling, and roadmap management for CIC phases
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: amber
  features:
    - navigation.instant
    - navigation.top
    - toc.integrate
    - search.suggest

nav:
  - CIC:
      - System: cic/CIC_SYSTEM.md
      - Project State: cic/CIC_PROJECT_STATE.md
  - Rewrite Labs:
      - System: rewrite/REWRITE_LABS_SYSTEM.md

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables
  - attr_list
  - md_in_html
