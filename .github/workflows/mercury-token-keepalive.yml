name: Mercury Token Keep-Alive

on:
  schedule:
    # Runs every Monday at 09:00 UTC — well within the 45-day inactivity window
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Mercury API
        env:
          MERCURY_API_TOKEN: ${{ secrets.MERCURY_API_TOKEN }}
        run: python3 scripts/mercury-keepalive.py
